<script>
const K="diario-palestra-v1";
let S=load();S.prof=S.prof||{};S.hist=S.hist||{};S.jr=S.jr||{};S.rm=S.rm||[];S.sess=S.sess||[];S.meas=S.meas||[];S.mets=S.mets||["Peso (kg)","Vita (cm)","Petto (cm)","Braccio (cm)","Coscia (cm)"];
function load(){try{const r=localStorage.getItem(K);if(r)return JSON.parse(r)}catch(e){}return{plans:[],logs:[],foods:[],sleep:[],prof:{},goal:2200,cur:null,tab:"h"}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const sh=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return iso(x)};
const lab=d=>d===iso(new Date())?"Oggi":new Date(d+"T12:00:00").toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"});
let day=iso(new Date()),rest=0,tmr=null,R=[],ws=S.act?"act":"list",edp=null,cc=false,restEnd=0,fl=false;

function paintRest(){$("#rest").hidden=!(rest>0);$("#rt").textContent="Recupero "+Math.floor(rest/60)+":"+String(rest%60).padStart(2,"0")}

function wViewOld(){
const p=plan();
if(!S.plans.length)return `<h1>Allenamento</h1><div class="card"><h3>Crea la tua prima scheda</h3><p class="mute">Per esempio Push, Pull o Gambe.</p><div class="row"><label>Nome scheda<input id="pn"></label><button class="pri" data-act="newplan">Crea scheda</button></div></div>`;
const t=iso(new Date());
let h=`<h1>Allenamento</h1><div class="top"><select id="sel" aria-label="Scheda">${S.plans.map(x=>`<option value="${x.id}"${x.id===S.cur?" selected":""}>${esc(x.name)}</option>`).join("")}</select><button data-act="delplan">Elimina</button></div><div class="row"><label>Nome scheda<input id="pr" value="${esc(p.name)}"></label></div><div class="row" style="margin-bottom:14px"><label>Nuova scheda<input id="pn"></label><button data-act="newplan">Crea</button></div>`;
p.ex.forEach(e=>{
const mine=S.logs.filter(l=>l.ex===e.id);
const td=mine.filter(l=>l.date===t);
const prevDates=mine.map(l=>l.date).filter(d=>d<t).sort();
const ld=prevDates[prevDates.length-1];
const ls=ld?mine.filter(l=>l.date===ld):[];
const pre=td[td.length-1]||ls[ls.length-1]||{kg:"",reps:"",rest:90};
h+=`<section class="card"><div class="top"><input class="nm" data-ex="${e.id}" value="${esc(e.name)}" aria-label="Nome esercizio"><button class="x" data-act="upex" data-id="${e.id}" aria-label="Sposta su">↑</button><button class="x" data-act="delex" data-id="${e.id}" aria-label="Rimuovi esercizio">×</button></div><p class="mute">${ld?"Ultima volta ("+lab(ld)+"): "+ls.map(s=>s.kg+"×"+s.reps).join(", "):"Nessuna sessione precedente"}</p><ol class="sets">${td.map((s,i)=>`<li><span>${i+1}</span><b>${s.kg} kg × ${s.reps}</b><span class="mute">rec. ${s.rest} s</span><button class="x" data-act="delset" data-id="${s.id}" aria-label="Elimina serie">×</button></li>`).join("")}</ol><div class="row"><label>Peso (kg)<input id="kg-${e.id}" inputmode="decimal" value="${pre.kg}"></label><label>Ripetizioni<input id="rp-${e.id}" inputmode="numeric" value="${pre.reps}"></label><label>Recupero (s)<input id="rc-${e.id}" inputmode="numeric" value="${pre.rest||90}"></label></div><div class="row"><button class="pri" style="width:100%" data-act="addset" data-id="${e.id}">Aggiungi serie</button></div></section>`});

return h}

if(ev.target.id==="nxn")nx.name=ev.target.value;if(d.mv!==undefined)mf.v[MT[d.mv]]=ev.target.value;if(ev.target.id==="mfd")mf.d=ev.target.value;if(ev.target.id==="mfn")mf.note=ev.target.value;if(d.jf){S.jr[jd]=S.jr[jd]||{};S.jr[jd][d.jf]=ev.target.value;save()}});
function render(){
applyTheme();const y=window.scrollY,k=S.tab+"|"+ws,ap2=$("#app");["w","h","j"].forEach(t=>$("#t"+t).setAttribute("aria-current",S.tab===t));ap2.innerHTML=({w:wView,h:hView,j:jView}[S.tab]||hView)();if(k!==render.k){ap2.classList.remove("fx");void ap2.offsetWidth;ap2.classList.add("fx");window.scrollTo(0,0);render.k=k}else window.scrollTo(0,y);tickEl();if(calFresh&&ws==="cal"){const c=$("#cm");if(c){c.scrollIntoView();calFresh=false}}}

document.addEventListener("click",ev=>{
const b=ev.target.closest("[data-act]");if(!b)return;
const a=b.dataset.act,id=b.dataset.id,num=s=>parseFloat(String($(s).value).replace(",","."))||0;
if(a==="stoprest"){clearInterval(tmr);rest=0;paintRest();return}
if(a==="tab"){S.tab=b.dataset.t}
else if(a==="newplan"){const n=$("#pn").value.trim();if(!n)return;const p={id:uid(),name:n,ex:[]};S.plans.push(p);S.cur=p.id}
else if(a==="delplan"){S.plans=S.plans.filter(p=>p.id!==S.cur);S.cur=S.plans[0]?S.plans[0].id:null}
else if(a==="addex"){const n=$("#en").value.trim();if(!n)return;plan().ex.push({id:uid(),name:n})}
else if(a==="delex"){plan().ex=plan().ex.filter(x=>x.id!==id)}
else if(a==="radd"){restEnd+=parseInt(b.dataset.n)*1000;rest=Math.max(1,Math.ceil((restEnd-Date.now())/1000));paintRest()}
else if(a==="wpick")ws="pick";
else if(a==="wedpick"){ws="edpick";dl=null}
else if(a==="wback")ws=ws==="ed"?"edpick":ws==="sview"&&pw==="cal"?"cal":"list";
else if(a==="wedit"){edp=id;ws="ed"}
else if(a==="wstart"){const p=S.plans.find(x=>x.id===id);S.act={pid:id,name:p.name,ex:JSON.parse(JSON.stringify(p.ex)),start:Date.now(),sets:{}};ws="act";cc=false}
else if(a==="wempty"){S.act={pid:"empty",name:"Allenamento libero",ex:[],start:Date.now(),sets:{}};ws="act";cc=false}
else if(a==="pnew"){const n=$("#prn").value.trim();if(!n)return;const p={id:uid(),name:n,ex:[]};S.plans.push(p);edp=p.id;ws="ed"}
else if(a==="pdel"){if(dl!==id){dl=id}else{S.plans=S.plans.filter(p=>p.id!==id);dl=null;if(S.cur===id)S.cur=S.plans[0]?S.plans[0].id:null}}
else if(a==="nxact"){nx={name:"",mu:null,from:"act"};ws="newex"}
else if(a==="mpick")nx.mu=nx.mu===b.dataset.m?null:b.dataset.m;
else if(a==="nxback")ws=nx.from;
else if(a==="nxok"){const n=nx.name.trim();if(!n)return;const e={id:uid(),name:n,notes:"",rest:90,n:3,mu:nx.mu||""};if(nx.from==="ed")S.plans.find(p=>p.id===edp).ex.push(e);else S.act.ex.push(e);ws=nx.from}
else if(a==="wrx"){S.act.ex=S.act.ex.filter(x=>x.id!==b.dataset.e);delete S.act.sets[b.dataset.e]}
else if(a==="eadd"){nx={name:"",mu:null,from:"ed"};ws="newex"}
else if(a==="edel"){const p=tp();p.ex=p.ex.filter(x=>x.id!==id)}
else if(a==="eup"){const x=tp().ex,i=x.findIndex(e=>e.id===id);if(i>0){const t=x[i-1];x[i-1]=x[i];x[i]=t}}
else if(a==="enm"){const e=tp().ex.find(x=>x.id===id);e.n=Math.max(1,Math.min(10,(e.n||3)+parseInt(b.dataset.d)))}
else if(a==="wck"){const e=S.act.ex.find(x=>x.id===b.dataset.e),s=S.act.sets[e.id][b.dataset.i],h=(S.hist[hk(e.name)]||[])[b.dataset.i]||{};if(s.ok)s.ok=false;else{if(s.kg==="")s.kg=h.kg??"";if(s.reps==="")s.reps=h.reps??"";if(s.reps==="")return;s.ok=true;startRest(e.rest||90)}}
else if(a==="wadd"){S.act.sets[b.dataset.e].push({kg:"",reps:"",ok:false})}
else if(a==="wrem"){const L=S.act.sets[b.dataset.e];if(L.length>1)L.pop()}
else if(a==="wend"){endW();return}
else if(a==="wendOld"){tp().ex.forEach(e=>{const ok=(S.act.sets[e.id]||[]).filter(s=>s.ok);if(ok.length&&e.name.trim())S.hist[hk(e.name)]=ok.map(s=>({kg:s.kg,reps:s.reps}))});S.act=null;ws="list";cc=false;clearInterval(tmr);rest=0;paintRest()}
else if(a==="wcancel"){if(!cc){cc=true;render();return}S.act=null;ws="list";cc=false}
else if(a==="wcal"){ws="cal";calFresh=true}
else if(a==="wmis"){ws="mis";dl=null}
else if(a==="wstat")ws="stat";
else if(a==="stp")sp=b.dataset.p;
else if(a==="cprev"){const[y,m]=calM.split("-").map(Number);calM=iso(new Date(y,m-2,1)).slice(0,7)}
else if(a==="cnext"){const[y,m]=calM.split("-").map(Number);calM=iso(new Date(y,m,1)).slice(0,7)}
else if(a==="mssave"){const v={};S.mets.forEach((m,i)=>{const x=$("#mv"+i).value.trim();if(x!=="")v[m]=x});if(!Object.keys(v).length)return;S.meas.push({id:uid(),date:$("#md").value||iso(new Date()),v:v})}
else if(a==="mvadd"){const n=$("#mn").value.trim();if(!n||S.mets.includes(n))return;S.mets.push(n)}
else if(a==="msdel"){if(dl!==id)dl=id;else{const c=S.meas.find(x=>x.id===id);try{((c&&c.ph)||[]).forEach(p=>localStorage.removeItem("fp-"+p))}catch(x){}S.meas=S.meas.filter(x=>x.id!==id);dl=null}}
else if(a==="gj")S.tab="j";
else if(a==="jmood"){const e=S.jr[jd]=S.jr[jd]||{},v=+b.dataset.i;e.mood=e.mood===v?0:v}
else if(a==="jprev")jd=sh(jd,-1);
else if(a==="jnext"){if(jd<iso(new Date()))jd=sh(jd,1)}
else if(a==="radd2"){const x=$("#rtx").value.trim();if(!x)return;S.rm.push({id:uid(),d:$("#rdt").value||iso(new Date()),t:$("#rtm").value||"09:00",x:x})}
else if(a==="rdel"){S.rm=S.rm.filter(r=>r.id!==id)}
else if(a==="gow")S.tab="w";
else if(a==="ghome")S.tab="h";
else if(a==="mstart"){mf={d:iso(new Date()),v:{},off:{},note:"",ph:[]};ws="mnew"}
else if(a==="mx"){const m=MT[b.dataset.i];mf.off[m]=!mf.off[m];if(mf.off[m])delete mf.v[m]}
else if(a==="mdisc"){ws="mis"}
else if(a==="msok"){const v={};MT.forEach(m=>{const x=String(mf.v[m]||"").trim();if(!mf.off[m]&&x!=="")v[m]=x});const nt=mf.note.trim();if(!Object.keys(v).length&&!nt&&!mf.ph.length)return;const ph=[];mf.ph.forEach(p=>{try{localStorage.setItem("fp-"+p.id,p.d);ph.push(p.id)}catch(x){}});S.meas.push({id:uid(),date:mf.d||iso(new Date()),v:v,note:nt,ph:ph});ws="mis"}
else if(a==="mphx"){mf.ph.splice(b.dataset.i,1)}
else if(a==="wmin"){S.tab="h"}
else if(a==="wopen"){S.tab="w";ws="act"}
else if(a==="sview"){pw=ws;S.sid=id;ws="sview"}
else if(a==="esave"){ws="edpick";fl=true}
else if(a==="upex"){const x=plan().ex,i=x.findIndex(e=>e.id===id);if(i>0){const t=x[i-1];x[i-1]=x[i];x[i]=t}}
else if(a==="addset"){const reps=parseInt($("#rp-"+id).value),rc=parseInt($("#rc-"+id).value)||0;if(!reps)return;S.logs.push({id:uid(),date:iso(new Date()),ex:id,kg:num("#kg-"+id),reps:reps,rest:rc});if(rc>0)startRest(rc)}
else if(a==="delset"){S.logs=S.logs.filter(l=>l.id!==id)}
save();render()});

document.addEventListener("change",ev=>{
if(ev.target.id==="sel"){S.cur=ev.target.value;save();render()}
if(ev.target.id==="pr"&&plan()){const n=ev.target.value.trim();if(n){plan().name=n;$("#sel").selectedOptions[0].textContent=n;save()}}
if(ev.target.dataset.ex){const e=plan().ex.find(x=>x.id===ev.target.dataset.ex),n=ev.target.value.trim();if(e&&n){e.name=n;save()}}
if(ev.target.id==="mph"){Promise.all([...ev.target.files].map(shrink)).then(a=>{a.forEach(d=>{if(d)mf.ph.push({id:uid(),d:d})});render()})}
});

if(!S.seeded){const D=[["Lunedì: Petto Schiena",["Panca piana con bilanciere","Panca inclinata con manubri","Croci ai cavi","Lat machine","Rematore con bilanciere","Pulley basso"]],["Martedì: Spalle Braccia",["Military press con manubri","Alzate laterali","Alzate posteriori ai cavi","Curl con bilanciere","Curl a martello","French press","Pushdown ai cavi"]],["Giovedì: Gambe",["Squat","Leg press","Affondi","Leg extension","Leg curl sdraiato","Stacco rumeno","Calf raise in piedi"]],["Venerdì: Petto Schiena",["Panca inclinata con bilanciere","Chest press","Dip alle parallele","Trazioni alla sbarra","Rematore con manubrio","Pullover ai cavi"]],["Sabato: Spalle Braccia",["Lento avanti con bilanciere","Alzate laterali ai cavi","Face pull","Curl su panca inclinata","Curl ai cavi","Estensioni sopra la testa con manubrio","Pushdown con corda"]]];D.forEach(d=>S.plans.push({id:uid(),name:d[0],ex:d[1].map(n=>({id:uid(),name:n}))}));S.cur=S.plans[S.plans.length-5].id;S.seeded=1;save()}
if(!S.v2){S.plans=["Lunedì: Petto Schiena","Martedì: Spalle Braccia","Giovedì: Gambe","Venerdì: Petto Schiena","Sabato: Spalle Braccia"].map(n=>({id:uid(),name:n,ex:[]}));S.hist={};S.v2=1;S.cur=S.plans[0].id;save()}
S.plans.forEach(p=>p.ex.forEach(e=>{if(S.hist[e.id]){if(e.name.trim())S.hist[hk(e.name)]=S.hist[e.id];delete S.hist[e.id]}}));
if(!["h","w","j"].includes(S.tab))S.tab="h";
if(S.act&&!S.act.ex){const p=S.plans.find(x=>x.id===S.act.pid);S.act.ex=p?JSON.parse(JSON.stringify(p.ex)):[];S.act.name=p?p.name:"Allenamento"}
if(!S.cur&&S.plans.length)S.cur=S.plans[0].id;
render();
</script>
